<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43B02A" />
      <stop offset="100%" stop-color="#0E5A9C" />
    </linearGradient>
  </defs>
  <!-- Outer gradient container matching Navbar brand mark -->
  <rect width="32" height="32" rx="7" fill="url(#mGrad)" />
  <!-- Inner dark background (#111827 / gray-900) -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="#111827" />
  <!-- Modern Sans-Serif Devanagari 'म' Glyph matching Navbar -->
  <text x="16" y="23" font-size="20" font-weight="700" font-family="'Nirmala UI', 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle" fill="url(#mGrad)">म</text>
</svg>
